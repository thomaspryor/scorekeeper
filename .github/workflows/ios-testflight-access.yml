name: iOS TestFlight access

# Puts the App Store Connect account holder and admins in an internal TestFlight
# group ("Owner") that automatically gets every build, so the owner can install
# builds from the TestFlight app. Safe to re-run; it only adds who is missing.

on:
  workflow_dispatch:

env:
  ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID || '7MPPJ2254M' }}
  ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID || '2d03cc88-e016-4fb7-8d89-a70a4a912875' }}
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8

jobs:
  testers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Write the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::Missing repository secret ASC_API_KEY_P8. See memory/app-store.md."
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Add the owner to the internal TestFlight group
        working-directory: ios
        run: fastlane internal_testers
