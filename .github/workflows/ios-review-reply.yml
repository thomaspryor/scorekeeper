name: iOS App Review reply

# Sends the owner's device recording to App Review, in three steps:
#   check  - download it from Google Drive, print its length, save still frames
#            as an artifact so the video can be checked. Changes nothing at Apple.
#   attach - check, then attach it to the review details and update the notes.
#   submit - attach, then resubmit the rejected version for review.
# The Drive file must be shared as "Anyone with the link" while this runs.

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: 'Google Drive file ID of the recording (from its share link)'
        required: true
        type: string
      step:
        description: 'How far to go'
        required: true
        default: check
        type: choice
        options: [check, attach, submit]

env:
  ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID || '7MPPJ2254M' }}
  ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID || '2d03cc88-e016-4fb7-8d89-a70a4a912875' }}
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8
  VIDEO: ${{ github.workspace }}/Scorekeep-iPhone-recording.mp4

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Download the recording from Google Drive
        env:
          FILE_ID: ${{ inputs.drive_file_id }}
        run: |
          if ! [[ "$FILE_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::drive_file_id must be the bare ID, not a URL"; exit 1
          fi
          curl -sSfL -o "$VIDEO" "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          # A file that is not shared comes back as an HTML sign-in page.
          if ! file "$VIDEO" | grep -qi 'ISO Media\|MP4'; then
            echo "::error::Not a video. Share the Drive file as 'Anyone with the link' and run again."
            file "$VIDEO"; exit 1
          fi
          ls -l "$VIDEO"

      - name: Length and still frames
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffprobe -v error -show_entries format=duration -of default=nw=1 "$VIDEO"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$VIDEO"
          mkdir -p frames
          ffmpeg -v error -i "$VIDEO" -vf "fps=1/8,scale=360:-1" frames/frame-%02d.jpg
          ls frames

      - uses: actions/upload-artifact@v4
        with:
          name: recording-frames
          path: frames/

      - name: Write the App Store Connect key
        if: inputs.step != 'check'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::Missing repository secret ASC_API_KEY_P8. See memory/app-store.md."
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        if: inputs.step != 'check'
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        if: inputs.step != 'check'
        run: gem install fastlane --no-document

      - name: Attach to App Review${{ inputs.step == 'submit' && ' and resubmit' || '' }}
        if: inputs.step != 'check'
        working-directory: ios
        run: fastlane review_reply attachment:"$VIDEO" submit:"${{ inputs.step == 'submit' }}"

      - name: Status afterwards
        if: inputs.step != 'check'
        working-directory: ios
        run: fastlane review_status
