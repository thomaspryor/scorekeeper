# Source of truth for Scorekeep.xcodeproj. After editing, regenerate with XcodeGen 2.46.0:
#   xcodegen generate --spec ios/project.yml
# CI (ios.yml) fails if the committed project differs from what this file generates.
name: Scorekeep
options:
  bundleIdPrefix: co.scorekeep
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_CFBundleDisplayName: Scorekeep
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    # The app uses no encryption, so uploads skip the export compliance question.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Scorekeep:
    type: application
    platform: iOS
    sources:
      - path: Scorekeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.scorekeep.app
        DEVELOPMENT_TEAM: 2837Q6TK6Y
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  ScorekeepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScorekeepTests
    dependencies:
      - target: Scorekeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.scorekeep.app.tests
        DEVELOPMENT_TEAM: 2837Q6TK6Y
        CODE_SIGN_STYLE: Automatic
  ScorekeepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ScorekeepUITests
    dependencies:
      - target: Scorekeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.scorekeep.app.uitests
        DEVELOPMENT_TEAM: 2837Q6TK6Y
        CODE_SIGN_STYLE: Automatic
schemes:
  Scorekeep:
    build:
      targets:
        Scorekeep: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ScorekeepTests
        - ScorekeepUITests
    archive:
      config: Release
