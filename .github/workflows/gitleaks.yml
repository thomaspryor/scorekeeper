name: Secret Scan (gitleaks)

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'ios/**'
      - '.github/**'
      - 'CLAUDE.md'
      - 'README.md'
      - '.gitleaks.toml'
  schedule:
    - cron: '0 7 * * 1'  # Mondays at 7 AM UTC
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel on master — a secret scan that
  # gets cancelled by the next commit reports nothing and looks identical to a
  # clean run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Shallow ON PURPOSE — a full-history clone can blow past this job's
      # timeout on a repo with heavy history. There's no history-scan step
      # below anyway (see NOTE), so a full fetch buys nothing here.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan 1 — what is in the code RIGHT NOW, regardless of when it landed.
      - name: Scan working tree
        run: |
          gitleaks detect --no-git --source . \
            --config .gitleaks.toml --no-banner --redact \
            --report-format sarif --report-path gitleaks-tree.sarif \
            --exit-code 1

      # NOTE: there is deliberately NO git-history scan step here. A full
      # git-log scan can blow past this job's timeout on a repo with heavy
      # history. Introduction-time coverage is handled instead by the
      # pre-commit hook (scripts/hooks/pre-commit, active via
      # core.hooksPath=scripts/hooks) running `gitleaks protect --staged`
      # before a secret can ever be committed.

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks-*.sarif
          if-no-files-found: ignore
