name: iOS Release

# Builds Scorekeep, uploads it to TestFlight, pushes the App Store listing and
# screenshots, and (when submit_for_review is true) sends it to App Review.
# Run from the Actions tab or the GitHub MCP tools; never needs a Mac.
#
# Needs one repository secret: ASC_API_KEY_P8 (the App Store Connect API key's
# .p8 contents). Key and issuer IDs default to the team key used by
# BroadwayScorecard-app; override with ASC_API_KEY_ID / ASC_API_KEY_ISSUER_ID.
# One-time App Store Connect setup and answers: memory/app-store.md.

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit this build for App Review after uploading (otherwise TestFlight + listing only)'
        type: boolean
        default: false

concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID || '7MPPJ2254M' }}
  ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID || '2d03cc88-e016-4fb7-8d89-a70a4a912875' }}
  TEAM_ID: 2837Q6TK6Y
  LC_ALL: en_US.UTF-8
  LANG: en_US.UTF-8

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Check the App Store Connect key is configured
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::Missing repository secret ASC_API_KEY_P8 (App Store Connect API key .p8 contents). See memory/app-store.md."
            exit 1
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Select newest Xcode (App Store needs Xcode 26+)
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          MAJOR="$(xcodebuild -version | awk '/^Xcode/{split($2, v, "."); print v[1]}')"
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::App Store uploads need Xcode 26 or newer; runner has $MAJOR."
            exit 1
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: |
          gem install fastlane --no-document
          fastlane --version

      - name: Register bundle ID and confirm the app record exists
        working-directory: ios
        run: fastlane preflight

      - name: Version and build number
        run: |
          VERSION="$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' ios/project.yml)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Releasing $VERSION (${{ github.run_number }})"

      - name: Run tests before shipping
        run: |
          UDID="$(python3 ios/scripts/find_simulator.py 'iPhone [0-9]+ Pro')"
          xcodebuild test -project ios/Scorekeep.xcodeproj -scheme Scorekeep \
            -destination "id=$UDID" -quiet CODE_SIGNING_ALLOWED=NO

      - name: Archive
        run: |
          # Unsigned archive; the export step signs it with a cloud-managed
          # distribution certificate through the API key.
          xcodebuild archive \
            -project ios/Scorekeep.xcodeproj \
            -scheme Scorekeep \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Scorekeep.xcarchive" \
            -quiet \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Export signed .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Scorekeep.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
          echo "IPA=$RUNNER_TEMP/export/Scorekeep.ipa" >> "$GITHUB_ENV"

      - name: Upload to TestFlight and wait for processing
        working-directory: ios
        run: fastlane beta ipa:"$IPA"

      - name: Capture screenshots
        run: ios/scripts/screenshots.sh ios/fastlane/screenshots/en-US

      - name: Push listing and screenshots${{ inputs.submit_for_review && ', submit for review' || '' }}
        working-directory: ios
        run: |
          fastlane listing version:"$VERSION" build_number:"$BUILD_NUMBER" submit:"${{ inputs.submit_for_review }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-${{ github.run_number }}
          path: ios/fastlane/screenshots/en-US/*.png
          if-no-files-found: ignore

      - name: Summary
        run: |
          {
            echo "### Scorekeep $VERSION ($BUILD_NUMBER)"
            echo "- Uploaded to TestFlight"
            echo "- Listing and screenshots pushed"
            if [ "${{ inputs.submit_for_review }}" = "true" ]; then
              echo "- Submitted for App Review (releases automatically once approved)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
